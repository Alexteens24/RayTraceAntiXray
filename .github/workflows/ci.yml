# Runner JDK 25 satisfies Paper 26.1 paperclip; Gradle toolchains provision Java 21 for paperTarget=1.21.11.
name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "RayTraceAntiXray/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "RayTraceAntiXray/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_JAVA_VERSION: "25"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        paperTarget: ["1.21.11", "26.1.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.CI_JAVA_VERSION }}

      - uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (${{ matrix.paperTarget }})
        run: ./gradlew build --no-daemon --stacktrace -PpaperTarget=${{ matrix.paperTarget }}

      - name: Prepare artifact (plugin JAR only)
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p "ci-out/${{ matrix.paperTarget }}"
          shopt -s nullglob
          for f in build/libs/RayTraceAntiXray-*-${{ matrix.paperTarget }}.jar; do
            cp "$f" "ci-out/${{ matrix.paperTarget }}/"
          done
          test "$(find "ci-out/${{ matrix.paperTarget }}" -name '*.jar' | wc -l)" -ge 1

      - name: Upload plugin JAR (${{ matrix.paperTarget }})
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: RayTraceAntiXray-${{ matrix.paperTarget }}-${{ github.sha }}
          path: ci-out/${{ matrix.paperTarget }}/*.jar
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI — paperTarget=${{ matrix.paperTarget }}"
            echo "| | |"
            echo "|--|--|"
            echo "| Event | ${{ github.event_name }} |"
            echo "| paperTarget | **${{ matrix.paperTarget }}** |"
            echo "| Runner JDK | **${{ env.CI_JAVA_VERSION }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
