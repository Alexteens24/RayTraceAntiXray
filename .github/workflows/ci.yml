# Runner JDK 25 for Gradle toolchains; plugin bytecode targets Java 21.
name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "RayTraceAntiXray/**"
      - "paper_1_21_11/**"
      - "paper_26_1_2/**"
      - "paper_26_2/**"
      - "paper_26_3/**"
      - "buildSrc/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "RayTraceAntiXray/**"
      - "paper_1_21_11/**"
      - "paper_26_1_2/**"
      - "paper_26_2/**"
      - "paper_26_3/**"
      - "buildSrc/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_JAVA_VERSION: "25"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.CI_JAVA_VERSION }}

      - uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Prepare artifact (universal plugin JAR)
        run: |
          mkdir -p ci-out
          shopt -s nullglob
          for f in build/libs/RayTraceAntiXray-*.jar; do
            case "$f" in
              *-plain.jar|*-sources.jar|*-javadoc.jar) continue ;;
            esac
            cp "$f" ci-out/
          done
          test "$(find ci-out -name '*.jar' | wc -l)" -ge 1

      - name: Upload plugin JAR
        id: upload-plugin
        uses: actions/upload-artifact@v4
        with:
          name: RayTraceAntiXray-${{ github.sha }}
          path: ci-out/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI — universal JAR"
            echo "| | |"
            echo "|--|--|"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Runner JDK | **${{ env.CI_JAVA_VERSION }}** |"
            echo "| Artifact retention | **14 days** |"
            if [ -n "${{ steps.upload-plugin.outputs.artifact-url }}" ]; then
              echo "| Download | [RayTraceAntiXray universal JAR](${{ steps.upload-plugin.outputs.artifact-url }}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.1.2", "26.2", "26.3"]
        include:
          - mc: "1.21.11"
            task: run1_21_11
            run_dir: run1_21_11
          - mc: "26.1.2"
            task: run26_1_2
            run_dir: run26_1_2
          - mc: "26.2"
            task: run26_2
            run_dir: run26_2
          - mc: "26.3"
            task: run26_3
            run_dir: run26_3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.CI_JAVA_VERSION }}

      - uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Smoke boot Paper ${{ matrix.mc }}
        run: |
          ./gradlew shadowJar --no-daemon --stacktrace
          # Without an accepted EULA Paper refuses to boot and no plugin code runs at all,
          # which would make the enable assertion below meaningless.
          echo "eula=true" > "${{ matrix.run_dir }}/eula.txt"
          set +e
          timeout 300 ./gradlew "${{ matrix.task }}" --no-daemon --stacktrace
          code=$?
          set -e
          # 124 = timeout, i.e. the server booted and kept running. Any other non-zero code is a real failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "::error::gradle ${{ matrix.task }} exited with $code"
            exit "$code"
          fi

      - name: Assert plugin enabled
        run: |
          log="${{ matrix.run_dir }}/logs/latest.log"
          if [ ! -f "$log" ]; then
            echo "::error::no server log at $log — the server never started"
            exit 1
          fi
          # A plugin that fails to enable (bad NMS binding, renamed reflective field,
          # unsupported server version) does NOT stop Paper, so a successful boot is
          # not enough. Require the plugin's own enable line: "[RayTraceAntiXray] <name> v<version> enabled".
          if ! grep -qE '\[RayTraceAntiXray\] .+ enabled$' "$log"; then
            echo "::error::RayTraceAntiXray did not enable on ${{ matrix.mc }}"
            echo "--- plugin / error lines ---"
            grep -iE "raytraceantixray|could not load|error|exception" "$log" | head -60
            exit 1
          fi
          if grep -qE "Could not load .*RayTraceAntiXray|Error occurred while enabling RayTraceAntiXray|Failed to enable" "$log"; then
            echo "::error::RayTraceAntiXray reported a load/enable failure on ${{ matrix.mc }}"
            grep -iE "raytraceantixray" "$log" | head -60
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Smoke — Paper ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
          log="${{ matrix.run_dir }}/logs/latest.log"
          if [ -f "$log" ] && grep -qE '\[RayTraceAntiXray\] .+ enabled$' "$log"; then
            echo "Plugin enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Plugin did **not** report as enabled." >> "$GITHUB_STEP_SUMMARY"
          fi
