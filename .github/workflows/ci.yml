# Runner JDK 25 for Gradle toolchains; plugin bytecode targets Java 21.
name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "RayTraceAntiXray/**"
      - "paper_1_21_11/**"
      - "paper_26_1_2/**"
      - "buildSrc/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "RayTraceAntiXray/**"
      - "paper_1_21_11/**"
      - "paper_26_1_2/**"
      - "buildSrc/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_JAVA_VERSION: "25"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.CI_JAVA_VERSION }}

      - uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Prepare artifact (universal plugin JAR)
        run: |
          mkdir -p ci-out
          shopt -s nullglob
          for f in build/libs/RayTraceAntiXray-*.jar; do
            case "$f" in
              *-plain.jar|*-sources.jar|*-javadoc.jar) continue ;;
            esac
            cp "$f" ci-out/
          done
          test "$(find ci-out -name '*.jar' | wc -l)" -ge 1

      - name: Upload plugin JAR
        id: upload-plugin
        uses: actions/upload-artifact@v4
        with:
          name: RayTraceAntiXray-${{ github.sha }}
          path: ci-out/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          {
            echo "## CI — universal JAR"
            echo "| | |"
            echo "|--|--|"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Runner JDK | **${{ env.CI_JAVA_VERSION }}** |"
            echo "| Artifact retention | **14 days** |"
            if [ -n "${{ steps.upload-plugin.outputs.artifact-url }}" ]; then
              echo "| Download | [RayTraceAntiXray universal JAR](${{ steps.upload-plugin.outputs.artifact-url }}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.1.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.CI_JAVA_VERSION }}

      - uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Smoke boot Paper ${{ matrix.mc }}
        run: |
          ./gradlew shadowJar --no-daemon --stacktrace
          timeout 180 ./gradlew \
            $([ "${{ matrix.mc }}" = "1.21.11" ] && echo run1_21_11 || echo run26_1_2) \
            --no-daemon --stacktrace --args="nogui" \
            || { code=$?; if [ "$code" -eq 124 ]; then exit 0; fi; exit "$code"; }

      - name: Summary
        if: always()
        run: |
          echo "## Smoke — Paper ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
